version: '3.8'

services:
  web:
    build: .
    container_name: glowup_fastapi
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./models:/app/models
      - ./backend/storage/uploads:/app/backend/storage/uploads
    # Override the URLs so they use Docker networking instead of localhost
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - REDIS_URL=redis://redis:6379

  mongodb:
    image: mongo:latest
    container_name: glowup_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:alpine
    container_name: glowup_redis
    ports:
      - "6379:6379"

volumes:
  mongodb_data:
